fail_1_1_1 ผนังห้องเก็บรักษาสัตว์น้ำผุกร่อน ชำรุด มีสนิม ผนังห้องด้านบนสกปรก
fail_1_1_2 ห้องเก็บรักษาสัตว์น้ำมีขนาดไม่เพียงพอ เช่น มีสัตว์น้ำกองอยู่นอกห้องเก็บ
fail_1_1_3 พบเศษซากสัตว์น้ำทิ้งค้างในห้องเก็บรักษาสัตว์น้ำ

fail_1_2_1 บริเวณพื้นที่ปฎิบัติงานมีมุมอับ ยากต่อการทำความสะอาด และมีความสกปรก

fail_1_3_1 พื้นที่ปฏิบัติงานมีคราบน้ำมันปนเปื้อนจากเครื่องยนต์ หรือเครื่องจักรช่วยทำการประมง เช่น เครื่องกว้าน รอกฯ ที่พักลูกเรือไม่สะอาดหรือไม่ถูกสุขลักษณะ

fail_1_4_1 สัตว์น้ำและเครื่องมือวางปะปนกัน ไม่เป็นระเบียบ
fail_1_4_2 การขนถ่ายที่ไม่ถูกสุขลักษณะ เช่น การเหยียบบนสัตว์น้ำ

fail_1_5_1 พื้นที่บริเวณปฏิบัติงานและห้องเก็บรักษาสัตว์น้ำไม่เรียบ เป็นร่อง ยาแนวหลุดล่อน ไม่ผุเปื่อย เป็นขุย
fail_1_5_2 หากเป็นพื้นผิวหลัก พบสนิมในเนื้อเหล็ก ตะปูหรือสมอขึ้นสนิม
fail_1_5_3 กรณีทาสี สีหลุดล่อน และปนเปื้อนลงในภาชนะบรรจุสัตว์น้ำ

fail_1_6_1 พื้นที่ปฏิบัติงานและห้องเก็บรักษาสัตว์น้ำ ล้างด้วยน้ำสกปรก
fail_1_6_2 พบสุนัข แมว อยู่บนเรือ และแมลงสาบ จิ้งจก หนู แมลง และสัตว์อื่นๆ ในเรือและห้องเก็บรักษาสัตว์น้ำ

fail_1_7_1 ไม่มีถุง/ถังใส่ขยะที่ย่อยสลายยาก เช่น ถุงพลาสติก ขวดแก้ว
fail_1_7_2 พบขยะ เช่น ก้นบุหรี ถุงพลาสติก กระป๋องและขวดเครื่องดื่มไม่อยู่ในที่จัดเก็บ
fail_1_7_3 พบเศษอาหาร เช่น เศษข้าว เศษขนม เศษผัไม่อยู่ในที่จัดเก็บ
fail_1_7_4 พบเศษสัตว์น้ำที่เหลือบนพื้นที่ปฏิบัติงาน

fail_2_1_1 อุปกรณ์ที่ใช้ในการเก็บสัตว์น้ำใช้ร่วมกับอุปกรณ์ที่ใช้เพื่อการอื่น เช่น นำตะกร้าใส่สัตว์น้ำมาใส่ผักไว้รับประทาน
fail_2_1_2 เก็บอุปกรณ์ไม่เหมาะสมกับสถานที่ เช่น รองเท้าบู๊ทเก็บในภาชนะบรรจุสัตว์น้ำ

fail_2_2_1 เครื่องมือและอุปกรณ์ที่สัมผัสกับสัตว์น้ำชำรุด มีรอยแตกหัก เป็นสนิม เช่น กระบะ ตะกร้า ลังโฟม ถังน้ำ ถังพลาสติก เครื่องโม่น้ำแข็งในเรือ พลั่วเหล็ก เป็นต้น

fail_2_3_1 ใช้วัสดุ อุปกรณ์ และเครื่องมือผิดประเภท เช่น ใช้พลั่วตักน้ำแข็งไปตักปลา

fail_2_4_1 ใช้น้ำไม่สะอาดล้างทำความสะอาดอุปกรณ์และเครื่องมือ
fail_2_4_2 พบเศษสัตว์น้ำในกองอวนหลังทำความสะอาดเรือ
fail_2_4_3 อุปกรณ์ไม่ได้ล้างทำความสะอดมีการหนักหมมของคราบสกปรก

fail_2_5_1 ภาชนะบรรจุสัตว์น้ำไม่แข็งแรง พลาสติกเปราะ แตกหัก อยู่ในสภาพที่ไม่เหมาะกับการใช้งานและวางภาชนะกดทับให้สัตว์น้ำได้รับความเสียหาย

fail_2_6_1 ในกรณีดองแห้งภาชนะไม่มีรูระบายน้ำ
fail_2_6_2 ในกรณีดองเปียก ภาชนะที่มีสัตว์น้ำอยู่ชำรุด

fail_3_1_1 ไม่มีใบตรวจสุขภาพของกระทรวงแรงงานสำหรับคนต่างชาติ
fail_3_1_2 ไม่มีใบรับแพทย์ (คนไทย)
fail_3_1_3 มีแผลเปิดแผลติดเชื้อ
fail_3_1_4 มีอาการไอ จาม มีน้ำมูก ตาแฉะ หนอง ฝี หรือแสดงอาการที่บ่งบอกการเป็นโรค

fail_3_2_1 ผู้ควบคุมเรือไม่ผ่านการอบรมหรือไม่มีประวัติฝ่านการอบรม

fail_3_4_1 ไม่ใส่เสื้อ กางเกง หรือไม่สวมรองเท้าป้องกันเท้าไม่ให้สัมผัสกับสัตว์น้ำโดยตรง

fail_3_5_1 พบว่ามีบุคลากรทานอาหาร กินหมาก ถ่มน้ำลาย หรือสูบบุหรี่ขณะปฏิบัติงาน

fail_4_1_1 น้ำแข็งไม่มีใบรับรองมาตรฐาน GMP หรือ อย.
fail_4_1_2 น้ำแข็งขุ่น มีตะกอน มีคราบสกปรก
fail_4_1_3 น้ำอุปโภคบริโภค ไม่สะอาด มีสี มีกลิ่น
fail_4_1_4 น้ำแข็ง น้ำอุปโภค มีปริมาณไม่เพียงพอ

fail_4_2_1 สถานที่เก็บและภาชนะที่บรรจุน้ำจืด และน้ำแข็งมีคราบสกปรกเป็นสนิม

fail_4_3_1 เครื่องโม่ ภาชนะขนถ่ายและรางขนส่งน้ำแข็งและน้ำจืด เป็นสนิม
fail_4_3_2 น้ำแข็งวางกองอยู่บนพื้นก่อนลงเรือ

fail_4_4_1 ไม่มีฝาปิด หรือฝาปิดชำรุด

fail_5_1_1 ไม่มีพื้นที่จัดเก็บสารเคมี เช่น ผงซักฟอก น้ำยาล้างจาน ยาฆ่าแมลง สี ที่เป็นสัดส่วน มีโอกาสปนเปื้อนกับสัตว์น้ำ

fail_5_2_1 ภาชนะบรรจุสัตว์น้ำไม่แข็งแรง ในขณะขนถ่ายพบว่าใช้ภาชนะที่แตกหัก อยู่ในสภาพที่ไม่เหมาะกับการใช้งาน ทำให้สัตว์น้ำเป็นรอย มีตำหนิ

fail_5_3_1 มีน้ำแข็งไม่เพียงพอในห้องเก็บสัตว์น้ำ ภาชนะ ถัง หรือกระบะที่มีสัตว์น้ำ
fail_5_3_2 สัตว์น้ำไม่สด

fail_5_4_1 มีน้ำแข็งไม่เพียงพอต่อการเก็บรักษาสัตว์น้ำ
fail_5_4_2 ในเรือแช่เยือกแข็ง อุณหภูมิของสัตว์น้ำสูงกว่า -18 องศาเซลเซียส

fail_5_5_1 เก็บสัตว์น้ำในที่ไม่เหมาะสม วางภาชนะบรรจุสัตว์น้ำบนดาดฟ้าเรือ มีน้ำแข็งน้อย ความเย็นไม่เพียงพอ

fail_5_6_1 ไม่มีสมุดบันทึกการทำประมง (fishing logbook) หรือไม่บันทึกข้อมูลการทำประมง

fail_5_7_1 ใช้อุปกรณ์ที่ก่อให้เกิดความเสียหายแก่สัตว์น้ำ เช่น ใช้วัสดุแหลมคม ตะขอสับที่ตัวสัตว์น้ำ
fail_5_7_2 ขณะขนถ่ายมีสัตว์น้ำตกหล่นบนพื้นเรือหรือแพปลา

fail_5_8_1 ไม่ติดตั้งเทอร์โมมิเตอร์หรืออุปกรณ์บันทึกอุณหภูมิ
fail_5_8_2 มีอุณหภูมิในห้องเก็บสัตว์น้ำสูงกว่า -18 องศาเซลเซียส

fail_5_9_1 อุณหภูมิใจกลางสัตว์น้ำ สูงกว่า -18 องศาเซลเซียส
